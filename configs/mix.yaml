# ============================================================
# Dreamy 数据配比配置
# ============================================================
# 两个阶段用两套类别，分开配置：
#   预训练 (pretrain) -> data/raw/<类别>/
#   SFT    (sft)      -> data/raw_sft/<类别>/
#
# 从零训练 ≠ 微调：
# 微调时模型已会中文，只看"行为塑形"；
# 从零训练必须先靠大量通用语料学会语言，再靠对话数据塑形。
# 这也是"配比错了会崩"最常见的原因：对话占比过高、通用语料太少
# -> 模型学不会稳定的语言分布 -> loss 震荡甚至发散。
# ============================================================

# ---------------- 第一阶段：预训练 ----------------
pretrain:
  # 通用语料是连续文本，没有 user/assistant 轮次概念。
  # 不声明为 document 会被当成"轮数不足的对话"全部丢掉。
  document_categories:
    - general
    - knowledge

  total: null      # null = 用尽清洗后的全部数据

  # 配比按「HF 上实际能拿到的已清洗数据」定：
  #   general   <- opencsg/chinese-fineweb-edu (Skypile)
  #   knowledge <- wanng/wikipedia-zh-mnbvc
  #   chat      <- silver/lccc
  #   empathy/depth/safety/persona <- Mxode/Chinese-Instruct 关键词分流
  #
  # 注意：之前 spec 里的 narrative（故事叙事）在 HF 上没找到干净的公开源，
  # 暂时并入 general。如果以后找到（如中文小说语料），在这里加回来。
  categories:
    general: 0.50      # 通用中文网页（已质量过滤）
    chat: 0.17         # 闲聊对话（LCCC 最浅，占比压低）
    knowledge: 0.22    # 百科/知识
    empathy: 0.07      # 情绪交流
    safety: 0.04       # 安全边界
    # depth / persona 暂时不进预训练：
    #   长文档 MinHash 太慢（6ms/篇），且这两类在 SFT 阶段
    #   用小规模高质量数据塑形效率高得多。
    #   需要时把权重加回来即可（默认会从 1.0 归一化）。

  packing:
    seq_len: 1024      # 与 ModelConfig.max_seq_len 一致

# ---------------- 第二阶段：SFT ----------------
sft:
  # SFT 数据都是对话，没有文档类
  document_categories: []
  total: null

  # 对应 spec §4.2（10M token x 2 epoch）
  categories:
    chat: 0.30         # 日常聊天
    empathy: 0.25      # 温柔倾听与情绪交流
    depth: 0.20        # 深度讨论
    opinion: 0.10      # 观点表达与思想交流
    followup: 0.10     # 追问与话题延伸
    boundary: 0.05     # 拒绝、纠错和边界处理

  packing:
    seq_len: 1024


# ---------------- 清洗参数（两阶段共用）----------------
quality:
  # 对话轮数范围（只算 user/assistant，system 不算一轮）
  min_turns: 2
  max_turns: 40

  # 单条数据总字数上限（超了截断）
  max_chars: 6000

  # 单轮最少字数。真实陪伴对话里有大量"嗯""然后呢"这类短回复，
  # 全删会让模型只会长篇大论，所以这里设得很低，只过滤真正的空串。
  min_chars_per_turn: 1

  # 复读检测
  max_repeat_ngram_ratio: 0.15
  repeat_ngram_n: 5

  # 乱码 / 刷屏
  max_punct_ratio: 0.5
  min_unique_char_ratio: 0.05

  # 去重
  exact_dedup: true
  near_dedup: true
  # 近似去重的 Jaccard 相似度阈值（0~1，越大越严格）
  #
  # 0.55 是实测标定的：中文对话短文本上
  #   「同话题但内容不同」最高约 0.03
  #   「真正的近似重复」最低约 0.56
  # 间隔很大，取 0.55 既能删掉措辞小改的重复，又不会误杀同话题的不同对话。
  # 重复数据仍多 -> 调到 0.50；同话题被误删 -> 调到 0.65。
  near_dedup_similarity: 0.55

  # 隐私脱敏：手机号 / 邮箱 / 身份证 / 网址
  redact_pii: true

  # 文档类（通用语料）专用
  min_chars_document: 50
  max_chars_document: 4000

  # 验证集比例：**按对话整条切分**，绝不能让同一条对话
  # 一半在 train 一半在 val，否则 val loss 是假的。
  val_ratio: 0.01


# ---------------- Tokenizer ----------------
tokenizer:
  # 必须与 src/config.py 的 ModelConfig.num_tokens 一致，
  # 否则训练时模型词表和 tokenizer 对不上（train.py 会按 meta.json 自动纠正并告警）。
  vocab_size: 32768
  model_type: bpe
  character_coverage: 0.9995
  # 训练词表用的语料上限（字符）。32k 词表 1-2 亿字符足够，
  # 全量喂进去只会让这一步慢 5 倍。
  max_chars: 150000000
