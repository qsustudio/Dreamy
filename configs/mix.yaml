# ============================================================
# Dreamy 数据配比配置（从零训练版）
# ============================================================
# 重要：从零训练 ≠ 微调。
#
# 微调时模型已经会中文了，配比只需考虑「行为塑形」。
# 从零训练时模型连字都不认识，必须先靠大量通用语料学会语言，
# 再用对话数据塑形。所以「通用语料」占比必须高。
#
# 这也是「配比错了会崩」最常见的原因：对话数据占比过高、
# 通用语料太少 → 模型学不会稳定的语言分布 → loss 震荡甚至发散。
# ============================================================

# 哪些类别是「纯文本文档」而不是对话。
# 通用语料是新闻/百科/小说这类连续文本，没有 user/assistant 的轮次概念。
# 如果不在这里声明，它会被当成「轮数不足的对话」全部丢掉。
document_categories:
  - general

# 总条数。null = 用尽所有清洗后的数据（推荐先用这个看总量）
# 也可以填一个整数，脚本会按比例采样到这个条数
total: null

# 各类数据的目标占比（会自动归一化，不用手动保证和为 1）
categories:
  # 中文通用语料：新闻 / 百科 / 小说 / 网络长文。
  # 作用：学会"说人话"。占比太低模型会语无伦次。
  general: 0.50

  # 开放域闲聊：日常对话、生活话题。
  # 作用：对话的自然度、口语感。
  chat: 0.20

  # 情感支持 / 共情：倾听、接住情绪、陪伴。
  # 作用：这是"陪伴感"的核心来源。
  empathy: 0.15

  # 深度内容：有观点、有推理、值得展开的话题。
  # 作用：避免只会说"嗯嗯我理解你"这类空话。
  depth: 0.07

  # 人设 / 角色一致：让 TA 始终是同一个人。
  # 作用：人格稳定，不像随机换了个 bot。
  persona: 0.05

  # 安全边界：危机干预、拒绝不当请求。
  # 作用：产品红线。占比小但必须有。
  safety: 0.03


# ---------------- 清洗参数 ----------------
quality:
  # 单条对话的轮数范围（1 轮 = 用户1句 + 回复1句）
  min_turns: 2
  max_turns: 30

  # 单条对话总字数上限（超了截断，不整条丢）
  max_chars: 3000

  # 单轮最少字数。注意：真实陪伴对话里有大量"嗯""然后呢"这类短回复，
  # 全部删掉会让模型只会长篇大论。这里设很低，只过滤真正的空串。
  min_chars_per_turn: 1

  # 重复 n-gram 占比上限，超过判为复读/灌水
  # 例：0.15 表示 5-gram 里重复的部分不超过 15%
  max_repeat_ngram_ratio: 0.15
  repeat_ngram_n: 5

  # 标点/符号占比上限（过滤乱码、颜文字刷屏）
  max_punct_ratio: 0.5

  # 字符多样性下限（唯一字符 / 总字符）
  min_unique_char_ratio: 0.05

  # 去重
  exact_dedup: true
  near_dedup: true
  # 近似去重的 Jaccard 相似度阈值（0~1，越大越严格）
  #
  # 0.55 是实测出来的：中文对话短文本上，
  #   「同话题但内容不同」的相似度最高约 0.03
  #   「真正的近似重复」最低约 0.56
  # 中间间隔很大，取 0.55 既能删掉措辞小改的重复，又不会误杀同话题的不同对话。
  # 如果发现重复数据仍很多 -> 调到 0.50
  # 如果发现同话题的不同对话被误删 -> 调到 0.65
  near_dedup_similarity: 0.55

  # 隐私脱敏：手机号 / 邮箱 / 身份证 / 网址
  redact_pii: true

  # ---- 通用语料（文档类）专用 ----
  # 一段文本少于这个字数就没有训练价值
  min_chars_document: 50
  # 单段上限，超了截断
  max_chars_document: 4000


# ---------------- Tokenizer ----------------
tokenizer:
  vocab_size: 16000      # T4 上训小模型，16k 够用；中文 32k 也常见
  model_type: bpe        # bpe | unigram
  character_coverage: 0.9995


# ---------------- 打包 ----------------
packing:
  # 训练用的序列长度。陪伴对话不需要长上下文，
  # 512 能覆盖绝大多数对话且显著省时间（attention 是 O(n²)）。
  seq_len: 512
